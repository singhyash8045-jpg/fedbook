
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fedbook Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#eef4fc;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:390px;background:#111d31;border:1px solid #243653;border-radius:18px;padding:25px}
.logo{text-align:center;font-size:42px;font-weight:bold;color:#168cff}
h2{text-align:center}
input{width:100%;padding:14px;margin:9px 0;background:#080d18;border:1px solid #354967;border-radius:9px;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;background:#168cff;border:0;border-radius:9px;color:white;font-size:16px;font-weight:bold}
.switch{text-align:center;color:#91a8c5;margin-top:18px;cursor:pointer}
#message{text-align:center;color:#ffb4b4;font-size:14px;margin-top:15px}
#profile{display:none;text-align:center}
.muted{color:#91a8c5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">FB</div>

  <section id="auth">
    <h2 id="heading">Login to Fedbook</h2>
    <input id="username" placeholder="Username" maxlength="20" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="mainButton" onclick="submitAuth()">Login</button>
    <div class="switch" onclick="toggleMode()" id="switchText">
      Create a new account
    </div>
    <div id="message"></div>
  </section>

  <section id="profile">
    <h2>Welcome to Fedbook!</h2>
    <p class="muted">Your username</p>
    <h2 id="profileName"></h2>
    <p class="muted">Your account is logged in.</p>
    <button onclick="logout()">Logout</button>
  </section>
</div>

<script>
const SUPABASE_URL = "https://eyvwfkavwppghmbjimgk.supabase.co";
const SUPABASE_KEY = "sb_publishable_MC_4M9VxUmd5mZ1-r4Rs4g_eVZ8GxCG";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let signupMode = false;

function showMessage(message, success=false) {
  const el = document.getElementById("message");
  el.textContent = message;
  el.style.color = success ? "#64d99b" : "#ffb4b4";
}

function toggleMode() {
  signupMode = !signupMode;
  document.getElementById("heading").textContent =
    signupMode ? "Create Fedbook Account" : "Login to Fedbook";
  document.getElementById("mainButton").textContent =
    signupMode ? "Sign Up" : "Login";
  document.getElementById("switchText").textContent =
    signupMode ? "Already have an account? Login" : "Create a new account";
  document.getElementById("password").value = "";
  showMessage("");
}

async function submitAuth() {
  const username = document.getElementById("username").value
    .trim().toLowerCase();
  const password = document.getElementById("password").value;
  const button = document.getElementById("mainButton");

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showMessage("Username 3-20 characters ka ho. Letters, numbers aur _ use karo.");
    return;
  }

  if (password.length < 6) {
    showMessage("Password kam se kam 6 characters ka hona chahiye.");
    return;
  }

  button.disabled = true;
  button.textContent = "Please wait...";
  showMessage("");

  try {
    const email = username + "@fedbook.app";

    if (signupMode) {
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { username: username }
        }
      });

      if (error) throw error;

      if (!data.session) {
        showMessage("Account bana, lekin session nahi mila. Supabase Email Confirmation setting check karo.");
        return;
      }

      const { error: profileError } = await db
        .from("profiles")
        .insert({
          id: data.user.id,
          username: username
        });

      if (profileError) {
        throw profileError;
      }

      showMessage("Account successfully created!", true);
      await showProfile(data.user);
    } else {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      await showProfile(data.user);
    }
  } catch (error) {
    showMessage(error.message || "Login failed. Please try again.");
  } finally {
    button.disabled = false;
    button.textContent = signupMode ? "Sign Up" : "Login";
  }
}

async function showProfile(user) {
  let { data: profile, error } = await db
    .from("profiles")
    .select("username")
    .eq("id", user.id)
    .maybeSingle();

  if (error) throw error;

  if (!profile && user.user_metadata?.username) {
    const { data, error: insertError } = await db
      .from("profiles")
      .insert({
        id: user.id,
        username: user.user_metadata.username
      })
      .select("username")
      .single();

    if (insertError) throw insertError;
    profile = data;
  }

  document.getElementById("auth").style.display = "none";
  document.getElementById("profile").style.display = "block";
  document.getElementById("profileName").textContent =
    profile?.username || "User";
}

async function logout() {
  await db.auth.signOut();
  document.getElementById("profile").style.display = "none";
  document.getElementById("auth").style.display = "block";
  document.getElementById("password").value = "";
  showMessage("Logged out successfully.", true);
}

async function checkSession() {
  const { data, error } = await db.auth.getSession();
  if (!error && data.session) {
    await showProfile(data.session.user);
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    document.getElementById("profile").style.display = "none";
    document.getElementById("auth").style.display = "block";
  }
});

checkSession();
</script>
</body>
</html>
