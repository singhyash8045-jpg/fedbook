
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fedbook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#080d18;--card:#111d31;--border:#263b59;
  --blue:#168cff;--text:#eef4fc;--muted:#91a8c5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{
  background:var(--card);padding:14px 18px;display:flex;
  justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5
}
header h2{margin:0;color:var(--blue)}
main{max-width:650px;margin:18px auto;padding:10px}
.card{background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:15px;margin-bottom:14px}
input,textarea{
  width:100%;padding:12px;margin:7px 0;background:#0b1424;
  color:white;border:1px solid #33445f;border-radius:8px
}
textarea{min-height:85px;resize:vertical}
button{
  background:var(--blue);color:white;border:0;padding:11px 15px;
  border-radius:8px;cursor:pointer;margin:3px
}
button.secondary{background:#263b59}
button:disabled{opacity:.5}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.avatar{
  width:65px;height:65px;border-radius:50%;background:var(--blue);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;overflow:hidden;flex-shrink:0
}
.avatar img{width:100%;height:100%;object-fit:cover}
.postimg{width:100%;max-height:430px;object-fit:contain;
  border-radius:10px;margin-top:10px;background:#080d18}
.posthead{display:flex;align-items:center;gap:10px}
.posthead .avatar{width:42px;height:42px;font-size:16px}
.posttext{white-space:pre-wrap;overflow-wrap:anywhere}
.verified{color:#168cff;font-weight:bold}
nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
nav button{flex:1}
.result{display:flex;align-items:center;gap:12px;
  padding:10px;border-bottom:1px solid var(--border)}
#message{color:#8fc5ff;overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
  <h2>FB Fedbook</h2>
  <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</header>

<main>
  <!-- LOGIN AND SIGNUP -->
  <section id="auth" class="card">
    <h2>Welcome to Fedbook</h2>

    <div id="signupFields">
      <input id="fullname" placeholder="Your Full Name" maxlength="50">
    </div>

    <input id="username" placeholder="Username" maxlength="20"
      autocomplete="username">
    <input id="password" type="password" placeholder="Password"
      autocomplete="current-password">

    <div class="actions">
      <button onclick="signup()">Create Account</button>
      <button class="secondary" onclick="login()">Login</button>
    </div>

    <p class="muted">
      Username: 3-20 letters, numbers or underscore.<br>
      Password: minimum 8 characters.
    </p>
    <p id="message"></p>
  </section>

  <!-- MAIN APP -->
  <section id="app" class="hidden">
    <nav>
      <button onclick="showSection('home')">Home</button>
      <button onclick="showSection('profile')">Profile</button>
      <button onclick="showSection('search')">Search</button>
      <button onclick="showSection('official')">Official</button>
    </nav>

    <!-- HOME -->
    <div id="homeSection">
      <div class="card">
        <h3>Create a Post</h3>
        <textarea id="caption" placeholder="What's on your mind?"></textarea>
        <input id="photo" type="file" accept="image/*">
        <button onclick="createPost()">Publish Post</button>
        <p id="postmessage" class="muted"></p>
      </div>
      <h2>Feed</h2>
      <div id="feed"></div>
    </div>

    <!-- PROFILE -->
    <div id="profileSection" class="hidden">
      <div class="card">
        <div class="posthead">
          <div class="avatar" id="myAvatar">F</div>
          <div>
            <h2 id="myName">My Profile</h2>
            <p id="myUsername" class="muted"></p>
          </div>
        </div>
        <p id="myBio" class="muted"></p>
        <p id="myCounts"></p>
        <input id="editName" placeholder="Change your name">
        <textarea id="editBio" placeholder="Write your bio"></textarea>
        <input id="avatarFile" type="file" accept="image/*">
        <button onclick="saveProfile()">Save Profile</button>
        <h3>My Posts</h3>
        <div id="myPosts"></div>
      </div>
    </div>

    <!-- SEARCH -->
    <div id="searchSection" class="hidden">
      <div class="card">
        <h3>Search People</h3>
        <input id="searchText" placeholder="Search username">
        <button onclick="searchPeople()">Search</button>
        <div id="searchResults"></div>
      </div>
    </div>

    <!-- OFFICIAL -->
    <div id="officialSection" class="hidden">
      <div class="card">
        <h2>Fedbook Official</h2>
        <p class="muted">
          Official verification is shown only for an account
          verified by the app administrator.
        </p>
        <div id="officialResult">Loading...</div>
      </div>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL =
  "https://eyvwfkavwppghmbjimgk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MC_4M9VxUmd5mZ1-r4Rs4g_eVZ8GxCG";

const FUNCTION_NAME = "rapid-function";
const CLOUD_NAME = "g1vmdztf";
const UPLOAD_PRESET = "Fedbook_upload";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let myProfile = null;

function el(id){
  return document.getElementById(id);
}

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function showMessage(text){
  el("message").textContent = text;
}

function showSection(name){
  ["home","profile","search","official"].forEach(x => {
    el(x+"Section").classList.toggle("hidden",x !== name);
  });

  if(name === "home") loadFeed();
  if(name === "profile") loadMyProfile();
  if(name === "official") loadOfficial();
}

function avatarHTML(profile){
  const name = safe(profile?.full_name || profile?.username || "F");
  if(profile?.avatar_url){
    return `<div class="avatar"><img src="${safe(profile.avatar_url)}" alt=""></div>`;
  }
  return `<div class="avatar">${name.charAt(0).toUpperCase()}</div>`;
}

function validateCredentials(){
  const username = el("username").value.trim().toLowerCase();
  const password = el("password").value;

  if(!/^[a-z0-9_]{3,20}$/.test(username)){
    throw new Error("Username 3-20 letters, numbers ya underscore hona chahiye.");
  }

  if(password.length < 8){
    throw new Error("Password kam se kam 8 characters ka hona chahiye.");
  }

  return {username,password};
}

/* USERNAME AUTH */
async function authRequest(action){
  const {username,password} = validateCredentials();

  const {data,error} = await db.functions.invoke(FUNCTION_NAME,{
    body:{action,username,password}
  });

  if(error){
    console.error("Function error:",error);
    throw new Error(
      "Edge Function se connection nahi hua. Supabase function aur uski settings check karni hongi."
    );
  }

  if(data?.error) throw new Error(data.error);
  return data;
}

async function signup(){
  try{
    const fullName = el("fullname").value.trim();

    if(!fullName){
      showMessage("Apna naam bharo.");
      return;
    }

    showMessage("Account ban raha hai...");

    const data = await authRequest("signup");

    if(data?.error) throw new Error(data.error);

    showMessage(
      "Signup request successful! Ab Login button se login karo."
    );
  }catch(error){
    showMessage(error.message || "Signup nahi ho paya.");
  }
}

async function login(){
  try{
    showMessage("Login ho raha hai...");

    const data = await authRequest("login");

    if(!data?.session?.access_token ||
       !data?.session?.refresh_token){
      throw new Error("Login session nahi mila. Function response check karo.");
    }

    const {error} = await db.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });

    if(error) throw error;

    const {data:sessionData,error:sessionError} =
      await db.auth.getSession();

    if(sessionError) throw sessionError;

    currentUser = sessionData.session.user;

    await ensureProfile();
    await startApp();

  }catch(error){
    showMessage(error.message || "Login nahi ho paya.");
  }
}

async function ensureProfile(){
  const {data,error} = await db.from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error) throw error;

  if(data){
    myProfile = data;
    return;
  }

  const username =
    currentUser.user_metadata?.username ||
    el("username").value.trim().toLowerCase();

  const fullName =
    currentUser.user_metadata?.full_name ||
    el("fullname").value.trim() ||
    username;

  const {data:newProfile,error:insertError} =
    await db.from("profiles").insert({
      id:currentUser.id,
      username,
      full_name:fullName,
      bio:"",
      is_official:false
    }).select().single();

  if(insertError) throw insertError;
  myProfile = newProfile;
}

async function startApp(){
  el("auth").classList.add("hidden");
  el("app").classList.remove("hidden");
  el("logoutBtn").classList.remove("hidden");
  showSection("home");
}

async function logout(){
  await db.auth.signOut();
  currentUser = null;
  myProfile = null;
  el("app").classList.add("hidden");
  el("logoutBtn").classList.add("hidden");
  el("auth").classList.remove("hidden");
  showMessage("Logout ho gaya.");
}

/* FEED */
async function loadFeed(){
  const feed = el("feed");
  feed.innerHTML = "Loading posts...";

  const {data:posts,error} = await db.from("posts")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    feed.textContent = "Posts load nahi hue: " + error.message;
    return;
  }

  if(!posts || posts.length === 0){
    feed.innerHTML = '<p class="muted">Abhi koi post nahi hai.</p>';
    return;
  }

  feed.innerHTML = "";

  for(const post of posts){
    const {data:profile} = await db.from("profiles")
      .select("username,full_name,avatar_url,is_official")
      .eq("id",post.user_id)
      .maybeSingle();

    const {count:likeCount} = await db.from("likes")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

    const {count:commentCount} = await db.from("comments")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

    const {data:myLike} = await db.from("likes")
      .select("user_id")
      .eq("post_id",post.id)
      .eq("user_id",currentUser.id)
      .maybeSingle();

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="posthead">
        ${avatarHTML(profile)}
        <div>
          <b>${safe(profile?.full_name || profile?.username || "User")}</b>
          ${profile?.is_official ? '<span class="verified"> ✓</span>' : ''}
          <div class="muted">@${safe(profile?.username || "user")}</div>
        </div>
      </div>
      <p class="posttext">${safe(post.caption || "")}</p>
      ${post.image_url ? `<img class="postimg" src="${safe(post.image_url)}" alt="Post image">` : ""}
      <div class="actions">
        <button class="secondary" data-like="${post.id}">
          ${myLike ? "Unlike" : "Like"} (${likeCount || 0})
        </button>
        <button class="secondary" data-comment="${post.id}">
          Comments (${commentCount || 0})
        </button>
      </div>
      <div id="comments-${post.id}"></div>
    `;

    card.querySelector("[data-like]").onclick =
      () => toggleLike(post.id);

    card.querySelector("[data-comment]").onclick =
      () => showComments(post.id);

    feed.appendChild(card);
  }
}

/* LIKE */
async function toggleLike(postId){
  const {data:existing,error:findError} = await db.from("likes")
    .select("user_id")
    .eq("post_id",postId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(findError){
    alert(findError.message);
    return;
  }

  let result;

  if(existing){
    result = await db.from("likes").delete()
      .eq("post_id",postId)
      .eq("user_id",currentUser.id);
  }else{
    result = await db.from("likes").insert({
      post_id:postId,
      user_id:currentUser.id
    });
  }

  if(result.error){
    alert(result.error.message);
    return;
  }

  loadFeed();
}

/* COMMENTS */
async function showComments(postId){
  const box = el("comments-"+postId);
  if(!box) return;

  const {data:comments,error} = await db.from("comments")
    .select("*")
    .eq("post_id",postId)
    .order("created_at",{ascending:true});

  if(error){
    box.textContent = error.message;
    return;
  }

  let html = `
    <input id="commentInput-${postId}" placeholder="Write a comment">
    <button onclick="addComment(${postId})">Send</button>
  `;

  for(const comment of (comments || [])){
    const {data:user} = await db.from("profiles")
      .select("username")
      .eq("id",comment.user_id)
      .maybeSingle();

    html += `<p><b>@${safe(user?.username || "user")}</b>:
      ${safe(comment.content)}</p>`;
  }

  box.innerHTML = html;
}

async function addComment(postId){
  const input = el("commentInput-"+postId);
  const content = input.value.trim();

  if(!content) return;

  const {error} = await db.from("comments").insert({
    post_id:postId,
    user_id:currentUser.id,
    content
  });

  if(error){
    alert(error.message);
    return;
  }

  showComments(postId);
}

/* IMAGE UPLOAD */
async function uploadImage(file){
  if(!file) return null;

  if(!file.type.startsWith("image/")){
    throw new Error("Sirf image upload karo.");
  }

  if(file.size > 8 * 1024 * 1024){
    throw new Error("Image 8 MB se chhoti honi chahiye.");
  }

  const form = new FormData();
  form.append("file",file);
  form.append("upload_preset",UPLOAD_PRESET);

  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {method:"POST",body:form}
  );

  const result = await response.json();

  if(!response.ok){
    throw new Error(result.error?.message || "Image upload failed.");
  }

  return result.secure_url;
}

/* CREATE POST */
async function createPost(){
  try{
    const caption = el("caption").value.trim();
    const file = el("photo").files[0];

    if(!caption && !file){
      el("postmessage").textContent = "Text ya photo add karo.";
      return;
    }

    el("postmessage").textContent = "Post upload ho raha hai...";

    let imageUrl = null;
    if(file) imageUrl = await uploadImage(file);

    const {error} = await db.from("posts").insert({
      user_id:currentUser.id,
      caption,
      image_url:imageUrl
    });

    if(error) throw error;

    el("caption").value = "";
    el("photo").value = "";
    el("postmessage").textContent = "Post publish ho gaya!";
    loadFeed();

  }catch(error){
    el("postmessage").textContent = error.message;
  }
}

/* MY PROFILE */
async function loadMyProfile(){
  const {data,error} = await db.from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .single();

  if(error){
    el("myPosts").textContent = error.message;
    return;
  }

  myProfile = data;

  el("myName").textContent = data.full_name || data.username;
  el("myUsername").textContent = "@"+data.username;
  el("myBio").textContent = data.bio || "";
  el("editName").value = data.full_name || "";
  el("editBio").value = data.bio || "";
  el("myAvatar").innerHTML = data.avatar_url
    ? `<img src="${safe(data.avatar_url)}" alt="">`
    : safe((data.username || "F").charAt(0).toUpperCase());

  const {count:followers} = await db.from("follows")
    .select("*",{count:"exact",head:true})
    .eq("following_id",currentUser.id);

  const {count:following} = await db.from("follows")
    .select("*",{count:"exact",head:true})
    .eq("follower_id",currentUser.id);

  el("myCounts").textContent =
    `Followers: ${followers || 0} | Following: ${following || 0}`;

  const {data:posts} = await db.from("posts")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("created_at",{ascending:false});

  el("myPosts").innerHTML = "";

  for(const post of (posts || [])){
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <p>${safe(post.caption || "")}</p>
      ${post.image_url ? `<img class="postimg" src="${safe(post.image_url)}" alt="">` : ""}
    `;
    el("myPosts").appendChild(div);
  }
}

async function saveProfile(){
  try{
    const full_name = el("editName").value.trim();
    const bio = el("editBio").value.trim();
    const file = el("avatarFile").files[0];

    let avatar_url = myProfile?.avatar_url || null;
    if(file) avatar_url = await uploadImage(file);

    const {error} = await db.from("profiles")
      .update({full_name,bio,avatar_url})
      .eq("id",currentUser.id);

    if(error) throw error;

    alert("Profile save ho gaya.");
    loadMyProfile();

  }catch(error){
    alert(error.message);
  }
}

/* SEARCH */
async function searchPeople(){
  const q = el("searchText").value.trim();

  if(!q){
    el("searchResults").textContent = "Username likho.";
    return;
  }

  const {data,error} = await db.from("profiles")
    .select("id,username,full_name,avatar_url,is_official")
    .ilike("username","%"+q+"%")
    .limit(20);

  if(error){
    el("searchResults").textContent = error.message;
    return;
  }

  el("searchResults").innerHTML = "";

  for(const user of (data || [])){
    const row = document.createElement("div");
    row.className = "result";

    row.innerHTML = `
      ${avatarHTML(user)}
      <div style="flex:1">
        <b>${safe(user.full_name || user.username)}</b>
        ${user.is_official ? '<span class="verified"> ✓</span>' : ''}
        <div class="muted">@${safe(user.username)}</div>
      </div>
      ${user.id !== currentUser.id
        ? `<button data-follow="${user.id}">Follow</button>`
        : "<span class='muted'>You</span>"}
    `;

    const followButton = row.querySelector("[data-follow]");
    if(followButton){
      followButton.onclick = () => toggleFollow(user.id,followButton);
    }

    el("searchResults").appendChild(row);
  }
}

/* FOLLOW */
async function toggleFollow(userId,button){
  const {data:existing,error:findError} = await db.from("follows")
    .select("follower_id")
    .eq("follower_id",currentUser.id)
    .eq("following_id",userId)
    .maybeSingle();

  if(findError){
    alert(findError.message);
    return;
  }

  if(existing){
    const {error} = await db.from("follows").delete()
      .eq("follower_id",currentUser.id)
      .eq("following_id",userId);

    if(error) return alert(error.message);
    button.textContent = "Follow";
  }else{
    const {error} = await db.from("follows").insert({
      follower_id:currentUser.id,
      following_id:userId
    });

    if(error) return alert(error.message);
    button.textContent = "Following";
  }
}

async function init(){
  const {data,error} = await db.auth.getSession();

  if(error){
    sh
