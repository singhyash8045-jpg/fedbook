
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fedbook</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d18;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#111d31;
 padding:15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:10;
 border-bottom:1px solid #243653;
}
.logo{
 font-size:26px;
 font-weight:bold;
 color:#168cff;
}
header button{
 background:#243653;
 color:white;
 border:0;
 padding:10px;
 border-radius:8px;
}
.search{
 padding:12px;
 background:#111d31;
}
.search input{
 width:100%;
 padding:12px;
 border:0;
 border-radius:10px;
 background:#243653;
 color:white;
}
.stories{
 display:flex;
 gap:12px;
 overflow-x:auto;
 padding:15px;
 background:#111d31;
}
.story{
 min-width:65px;
 text-align:center;
 font-size:12px;
}
.story img{
 width:58px;
 height:58px;
 border-radius:50%;
 border:3px solid #168cff;
 object-fit:cover;
}
.create{
 margin:12px;
 padding:15px;
 background:#111d31;
 border-radius:12px;
}
.create textarea{
 width:100%;
 padding:12px;
 background:#243653;
 color:white;
 border:0;
 border-radius:8px;
 resize:vertical;
}
.create button,.post button{
 padding:10px 13px;
 border:0;
 border-radius:8px;
 background:#243653;
 color:white;
 cursor:pointer;
}
.create .publish{
 background:#168cff;
 margin-top:10px;
}
.post{
 margin:12px;
 background:#111d31;
 border:1px solid #243653;
 border-radius:12px;
 overflow:hidden;
}
.post-head{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px;
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 object-fit:cover;
}
.author{
 font-weight:bold;
}
.demo{
 font-size:10px;
 color:#91a8c5;
}
.post-text{
 padding:0 12px 12px;
}
.post-photo{
 width:100%;
 display:block;
 max-height:450px;
 object-fit:cover;
}
.stats{
 display:flex;
 justify-content:space-between;
 padding:10px 12px;
 color:#91a8c5;
 font-size:13px;
}
.actions{
 display:flex;
 justify-content:space-around;
 padding:10px;
 border-top:1px solid #243653;
}
.actions button{
 flex:1;
 margin:2px;
}
.actions .liked{
 color:#168cff;
}
.comment-area{
 padding:10px;
 border-top:1px solid #243653;
}
.comment-area input{
 width:75%;
 padding:10px;
 background:#243653;
 border:0;
 color:white;
 border-radius:8px;
}
.comment-area button{
 background:#168cff;
}
.comments{
 padding:0 12px 12px;
 font-size:13px;
 color:#cbd5e1;
}
nav{
 position:sticky;
 bottom:0;
 background:#111d31;
 display:flex;
 justify-content:space-around;
 padding:13px;
 border-top:1px solid #243653;
}
nav button{
 background:none;
 border:0;
 color:white;
 font-size:20px;
}
footer{
 text-align:center;
 color:#91a8c5;
 padding:20px;
 font-size:12px;
}
</style>
</head>

<body>

<header>
 <div class="logo">FB Fedbook</div>
 <button onclick="window.scrollTo(0,0)">⌂ Home</button>
</header>

<div class="search">
 <input id="search" placeholder="पोस्ट खोजें..."
 oninput="renderPosts()">
</div>

<div class="stories" id="stories"></div>

<div class="create">
 <h3>📝 Create Post</h3>
 <textarea id="newText" placeholder="आपके मन में क्या है?"></textarea>
 <br><br>
 <input type="file" id="newPhoto" accept="image/*">
 <br>
 <button class="publish" onclick="createPost()">Post करें</button>
</div>

<div id="feed"></div>

<footer>
 Fedbook © 2026<br>
 Demo posts और demo accounts
</footer>

<nav>
 <button onclick="window.scrollTo(0,0)">🏠</button>
 <button onclick="document.getElementById('search').focus()">🔍</button>
 <button onclick="document.getElementById('newText').focus()">➕</button>
 <button onclick="alert('यह Demo Profile है')">👤</button>
</nav>

<script>
const demoNames = [
 "Rahul Kumar","Aman Singh","Priya Sharma",
 "Rohit Verma","Neha Kumari","Vikas Raj",
 "Arjun Singh","Sneha Gupta","Aditya Kumar",
 "Pooja Singh","Virat Fan Club","Cricket Lover"
];

const demoTexts = [
 "आज का दिन शानदार है ❤️",
 "Cricket is my passion 🏏",
 "Keep smiling 😊",
 "Never give up 💪",
 "Beautiful nature 🌳",
 "Love my India 🇮🇳",
 "Dream big 🔥",
 "Travel memories 📸",
 "Good morning ☀️",
 "Life is beautiful ❤️",
 "आज की यादगार तस्वीर ❤️",
 "Enjoy every moment 😎",
 "जय हिंद 🇮🇳",
 "मंजिल उन्हीं को मिलती है जो मेहनत करते हैं 💯",
 "Weekend vibes ✨"
];

let posts = [];

function loadPosts(){
 try{
  posts = JSON.parse(localStorage.getItem("fedbook_posts")) || [];
 }catch(e){
  posts = [];
 }

 if(!posts.some(p=>p.isDemo)){
  for(let i=0;i<100;i++){
   posts.push({
    id:"demo_"+i,
    author:demoNames[i%demoNames.length],
    text:demoTexts[i%demoTexts.length],
    photo:"https://picsum.photos/seed/fedbook"+i+"/700/500",
    avatar:"https://i.pravatar.cc/100?img="+((i%60)+1),
    likes:(i*17)%5000,
    liked:false,
    comments:[],
    isDemo:true
   });
  }
  savePosts();
 }
}

function savePosts(){
 try{
  localStorage.setItem("fedbook_posts",JSON.stringify(posts));
 }catch(e){
  alert("Storage भर गया है। कुछ फोटो वाले पोस्ट हटाने पड़ सकते हैं।");
 }
}

function renderStories(){
 let names=["Your Story","Rahul","Aman","Priya","Rohit","Neha"];
 document.getElementById("stories").innerHTML=
 names.map((n,i)=>`
 <div class="story">
 <img src="https://i.pravatar.cc/100?img=${i+1}">
 <div>${n}</div>
 </div>`).join("");
}

function renderPosts(){
 let query=document.getElementById("search").value.toLowerCase();

 let filtered=posts.filter(p=>
 (p.text||"").toLowerCase().includes(query) ||
 (p.author||"").toLowerCase().includes(query)
 );

 document.getElementById("feed").innerHTML=
 filtered.map(p=>`
 <div class="post">

 <div class="post-head">
 <img class="avatar" src="${escapeHTML(p.avatar||'https://i.pravatar.cc/100')}" >
 <div>
 <div class="author">${escapeHTML(p.author)}</div>
 <div class="demo">${p.isDemo?'Demo Account':'Fedbook Member'}</div>
 </div>
 </div>

 <div class="post-text">${escapeHTML(p.text)}</div>

 ${p.photo?`<img class="post-photo" src="${escapeHTML(p.photo)}" loading="lazy" alt="Post photo">`:''}

 <div class="stats">
 <span>❤️ ${p.likes||0} Likes</span>
 <span>${(p.comments||[]).length} Comments</span>
 </div>

 <div class="actions">
 <button class="${p.liked?'liked':''}" onclick="likePost('${p.id}')">
 ❤️ Like
 </button>
 <button onclick="focusComment('${p.id}')">💬 Comment</button>
 <button onclick="sharePost('${p.id}')">↗ Share</button>
 </div>

 <div class="comment-area">
 <input id="comment_${p.id}" placeholder="Comment लिखें...">
 <button onclick="addComment('${p.id}')">Send</button>
 </div>

 <div class="comments">
 ${(p.comments||[]).map(c=>`<p>💬 <b>${escapeHTML(c.name)}</b>: ${escapeHTML(c.text)}</p>`).join("")}
 </div>

 </div>
 `).join("");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function likePost(id){
 let p=posts.find(x=>x.id===id);
 if(!p)return;

 if(p.liked){
  p.likes=Math.max(0,p.likes-1);
  p.liked=false;
 }else{
  p.likes++;
  p.liked=true;
 }
 savePosts();
 renderPosts();
}

function focusComment(id){
 document.getElementById("comment_"+id).focus();
}

function addComment(id){
 let p=posts.find(x=>x.id===id);
 let input=document.getElementById("comment_"+id);

 if(!p||!input.value.trim())return;

 p.comments=p.comments||[];
 p.comments.push({
  name:"You",
  text:input.value.trim()
 });

 savePosts();
 renderPosts();
}

function sharePost(id){
 let p=posts.find(x=>x.id===id);
 if(!p)return;

 let content=p.text+" - Fedbook";

 if(navigator.share){
  navigator.share({title:"Fedbook",text:content}).catch(()=>{});
 }else if(navigator.clipboard){
  navigator.clipboard.writeText(content)
  .then(()=>alert("Post text copied!"));
 }else{
  alert(content);
 }
}

function createPost(){
 let text=document.getElementById("newText").value.trim();
 let file=document.getElementById("newPhoto").files[0];

 if(!text && !file){
  alert("कुछ लिखें या फोटो चुनें!");
  return;
 }

 let post={
  id:"user_"+Date.now(),
  author:"You",
  text:text,
  photo:"",
  avatar:"https://i.pravatar.cc/100?img=12",
  likes:0,
  liked:false,
  comments:[],
  isDemo:false
 };

 function finish(){
  posts.unshift(post);
  savePosts();
  document.getElementById("newText").value="";
  document.getElementById("newPhoto").value="";
  renderPosts();
  window.scrollTo(0,0);
 }

 if(file){
  if(!file.type.startsWith("image/")){
   alert("सिर्फ फोटो चुनें");
   return;
  }
  if(file.size>2*1024*1024){
   alert("फोटो 2 MB से छोटी चुनें");
   return;
  }

  let reader=new FileReader();
  reader.onload=function(){
   post.photo=reader.result;
   finish();
  };
  reader.readAsDataURL(file);
 }else{
  finish();
 }
}

loadPosts();
renderStories();
renderPosts();
</script>

</body>
</html>
