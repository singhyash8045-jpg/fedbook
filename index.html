
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#111827;text-align:center;font-size:24px;font-weight:bold}
main{max-width:650px;margin:auto;padding:16px}
.card{background:#151e2e;padding:16px;border-radius:14px;margin:14px 0}
input,textarea,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:15px}
input,textarea{background:#263348;color:white}
button{background:#2878f0;color:white;font-weight:bold}
button:disabled{opacity:.5}
.post{background:#151e2e;padding:15px;border-radius:12px;margin:14px 0}
.post img{width:100%;border-radius:10px;margin-top:10px}
.small{color:#aab7ca;font-size:13px}
.hidden{display:none}
h3{margin-top:5px}
</style>
</head>
<body>

<header>UC · Universal Chat</header>

<main>
<section id="auth">
<div class="card">
<h2>Welcome to Universal Chat</h2>
<input id="username" placeholder="Username (3-20 characters)">
<input id="password" type="password" placeholder="Password (minimum 6 characters)">
<button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>
<p id="authMessage" class="small"></p>
</div>
</section>

<section id="app" class="hidden">
<div class="card">
<h3 id="welcome">Welcome</h3>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Create Post</h3>
<textarea id="caption" placeholder="What's happening?"></textarea>
<input id="photo" type="file" accept="image/*">
<button id="publishButton" onclick="publishPost()">Publish Post</button>
<p id="postMessage" class="small"></p>
</div>

<h3>Home Feed</h3>
<button onclick="loadPosts()">Refresh Posts</button>
<div id="feed"></div>
</section>
</main>

<script>
const SUPABASE_URL="https://pncaubpjfthccofynxya.supabase.co";
const SUPABASE_KEY="sb_publishable_X_Mv4fdvzlN437ZStGuxdA_0lBnvzX6";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;

function message(id,text){
 document.getElementById(id).textContent=text;
}

function clean(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

async function saveProfile(user,username){
 const {error}=await db.from("profiles").upsert({
  id:user.id,
  username:username
 });
 if(error) throw error;
}

async function signup(){
 const username=document.getElementById("username").value.trim().toLowerCase();
 const password=document.getElementById("password").value;

 if(!/^[a-z0-9_]{3,20}$/.test(username)){
  return message("authMessage","Username 3-20 characters ka ho.");
 }
 if(password.length<6){
  return message("authMessage","Password kam se kam 6 characters ka ho.");
 }

 message("authMessage","Account ban raha hai...");

 try{
  const {data,error}=await db.auth.signUp({
   email:username+"@universalchat.app",
   password:password,
   options:{data:{username:username}}
  });
  if(error) throw error;
  if(!data.session){
   return message("authMessage","Confirmation setting check karo. Email confirmation OFF hona chahiye.");
  }
  await saveProfile(data.user,username);
  currentUser=data.user;
  showApp(username);
 }catch(e){
  message("authMessage",e.message);
 }
}

async function login(){
 const username=document.getElementById("username").value.trim().toLowerCase();
 const password=document.getElementById("password").value;

 if(!username||!password){
  return message("authMessage","Username aur password bharo.");
 }

 message("authMessage","Login ho raha hai...");

 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:username+"@universalchat.app",
   password:password
  });
  if(error) throw error;

  currentUser=data.user;
  await saveProfile(currentUser,username);
  showApp(username);
 }catch(e){
  message("authMessage",e.message);
 }
}

function showApp(username){
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("welcome").textContent="Welcome, "+username;
 loadPosts();
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 document.getElementById("app").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
}

async function publishPost(){
 if(!currentUser) return;

 const caption=document.getElementById("caption").value.trim();
 const file=document.getElementById("photo").files[0];
 const button=document.getElementById("publishButton");

 if(!caption&&!file){
  return message("postMessage","Text ya photo select karo.");
 }

 if(file && !file.type.startsWith("image/")){
  return message("postMessage","Sirf image file select karo.");
 }

 if(file && file.size>5*1024*1024){
  return message("postMessage","Photo 5 MB se chhoti honi chahiye.");
 }

 button.disabled=true;
 message("postMessage","Post upload ho rahi hai...");

 try{
  let imagePath=null;

  if(file){
   const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   imagePath=currentUser.id+"/"+Date.now()+"_"+safeName;

   const {error:uploadError}=await db.storage
    .from("post-images")
    .upload(imagePath,file,{upsert:false});

   if(uploadError) throw uploadError;
  }

  const {error}=await db.from("posts").insert({
   user_id:currentUser.id,
   caption:caption,
   image_url:imagePath
  });

  if(error){
   if(imagePath){
    await db.storage.from("post-images").remove([imagePath]);
   }
   throw error;
  }

  document.getElementById("caption").value="";
  document.getElementById("photo").value="";
  message("postMessage","Post successfully publish ho gayi!");
  await loadPosts();

 }catch(e){
  message("postMessage",e.message);
 }finally{
  button.disabled=false;
 }
}

async function loadPosts(){
 const feed=document.getElementById("feed");
 feed.textContent="Posts load ho rahe hain...";

 try{
  const {data:posts,error}=await db.from("posts")
   .select("id,user_id,caption,image_url,created_at")
   .order("created_at",{ascending:false})
   .limit(50);

  if(error) throw error;

  if(!posts.length){
   feed.textContent="Abhi koi post nahi hai.";
   return;
  }

  const ids=[...new Set(posts.map(p=>p.user_id))];
  const {data:profiles,error:profileError}=await db.from("profiles")
   .select("id,username")
   .in("id",ids);

  if(profileError) throw profileError;

  const names={};
  (profiles||[]).forEach(p=>names[p.id]=p.username);

  feed.innerHTML="";

  for(const post of posts){
   const card=document.createElement("div");
   card.className="post";

   const name=names[post.user_id]||"Member";
   let imageHTML="";

   if(post.image_url){
    const {data:signed,error:signedError}=await db.storage
     .from("post-images")
     .createSignedUrl(post.image_url,3600);

    if(!signedError&&signed?.signedUrl){
     imageHTML='<img src="'+clean(signed.signedUrl)+'" alt="Post photo">';
    }else{
     imageHTML='<p class="small">Photo load nahi hui.</p>';
    }
   }

   card.innerHTML=
    '<b>@'+clean(name)+'</b>'+
    '<p>'+clean(post.caption)+'</p>'+
    imageHTML+
    '<p class="small">'+
    (post.created_at?new Date(post.created_at).toLocaleString():"")+
    '</p>';

   feed.appendChild(card);
  }

 }catch(e){
  feed.textContent="Error: "+e.message;
 }
}

async function restoreSession(){
 const {data,error}=await db.auth.getSession();
 if(error) return;

 if(data.session){
  currentUser=data.session.user;
  const username=currentUser.user_metadata?.username||"Member";
  showApp(username);
 }
}

restoreSession();
</script>
</body>
</html>
