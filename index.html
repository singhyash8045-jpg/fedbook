
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial}
header{background:#111827;padding:18px;text-align:center;font-size:25px;font-weight:bold}
main{max-width:650px;margin:auto;padding:15px}
.card,.post{background:#151e2e;padding:16px;border-radius:13px;margin:14px 0}
input,textarea,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:15px}
input,textarea{background:#263348;color:white}
button{background:#2878f0;color:white;font-weight:bold}
.delete{background:#d52f3e}
.small{color:#aab7ca;font-size:13px}
.hidden{display:none}
.post img{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<header>UC · Universal Chat</header>
<main>

<section id="auth">
<div class="card">
<h2>Welcome to Universal Chat</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>
<p id="authMessage" class="small"></p>
</div>
</section>

<section id="app" class="hidden">
<div class="card">
<h3 id="welcome"></h3>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Create Post</h3>
<textarea id="caption" placeholder="What's happening?"></textarea>
<input id="photo" type="file" accept="image/*">
<button id="publishButton" onclick="publishPost()">Publish Post</button>
<p id="postMessage" class="small"></p>
</div>

<h3>Home Feed</h3>
<button onclick="loadPosts()">Refresh Posts</button>
<div id="feed"></div>
</section>

</main>

<script>
const SUPABASE_URL="https://pncaubpjfthccofynxya.supabase.co";
const SUPABASE_KEY="sb_publishable_X_Mv4fdvzlN437ZStGuxdA_0lBnvzX6";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;

function msg(id,t){
 document.getElementById(id).textContent=t;
}
function clean(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}
async function saveProfile(user,username){
 const {error}=await db.from("profiles").upsert({
  id:user.id,username
 });
 if(error)throw error;
}
function showApp(username){
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("welcome").textContent="Welcome, "+username;
 loadPosts();
}
async function signup(){
 const u=document.getElementById("username").value.trim().toLowerCase();
 const p=document.getElementById("password").value;
 if(!/^[a-z0-9_]{3,20}$/.test(u))
  return msg("authMessage","Username 3-20 characters ka ho.");
 if(p.length<6)return msg("authMessage","Password minimum 6 characters.");
 msg("authMessage","Account ban raha hai...");
 try{
  const {data,error}=await db.auth.signUp({
   email:u+"@universalchat.app",password:p,
   options:{data:{username:u}}
  });
  if(error)throw error;
  if(!data.session)return msg("authMessage","Email confirmation OFF karke dobara try karo.");
  await saveProfile(data.user,u);
  currentUser=data.user;
  showApp(u);
 }catch(e){msg("authMessage",e.message);}
}
async function login(){
 const u=document.getElementById("username").value.trim().toLowerCase();
 const p=document.getElementById("password").value;
 msg("authMessage","Login ho raha hai...");
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:u+"@universalchat.app",password:p
  });
  if(error)throw error;
  currentUser=data.user;
  await saveProfile(currentUser,u);
  showApp(u);
 }catch(e){msg("authMessage",e.message);}
}
async function logout(){
 await db.auth.signOut();
 currentUser=null;
 document.getElementById("app").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
}
async function publishPost(){
 const caption=document.getElementById("caption").value.trim();
 const file=document.getElementById("photo").files[0];
 const button=document.getElementById("publishButton");
 if(!caption&&!file)return msg("postMessage","Text ya photo select karo.");
 if(file&&!file.type.startsWith("image/"))return msg("postMessage","Sirf image select karo.");
 if(file&&file.size>5*1024*1024)return msg("postMessage","Photo 5 MB se chhoti honi chahiye.");
 button.disabled=true;
 msg("postMessage","Post upload ho rahi hai...");
 try{
  let imagePath=null;
  if(file){
   imagePath=currentUser.id+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const {error}=await db.storage.from("post-images").upload(imagePath,file);
   if(error)throw error;
  }
  const {error}=await db.from("posts").insert({
   user_id:currentUser.id,caption,image_url:imagePath
  });
  if(error){
   if(imagePath)await db.storage.from("post-images").remove([imagePath]);
   throw error;
  }
  document.getElementById("caption").value="";
  document.getElementById("photo").value="";
  msg("postMessage","Post publish ho gayi!");
  await loadPosts();
 }catch(e){msg("postMessage",e.message);}
 finally{button.disabled=false;}
}

async function deletePost(id,imagePath){
 if(!confirm("Kya apni post delete karni hai?"))return;
 try{
  const {data,error}=await db.from("posts")
   .delete()
   .eq("id",id)
   .eq("user_id",currentUser.id)
   .select("id");

  if(error)throw error;
  if(!data || data.length===0){
   throw new Error("Post delete nahi hui. Supabase DELETE policy check karo.");
  }

  if(imagePath){
   const {error:photoError}=await db.storage
    .from("post-images").remove([imagePath]);
   if(photoError)console.error(photoError.message);
  }

  alert("Post delete ho gayi!");
  await loadPosts();
 }catch(e){
  alert("Delete Error: "+e.message);
 }
}

async function loadPosts(){
 const feed=document.getElementById("feed");
 feed.textContent="Posts load ho rahe hain...";
 try{
  const {data:posts,error}=await db.from("posts")
   .select("id,user_id,caption,image_url,created_at")
   .order("created_at",{ascending:false}).limit(50);
  if(error)throw error;
  if(!posts.length){feed.textContent="Abhi koi post nahi hai.";return;}

  const ids=[...new Set(posts.map(p=>p.user_id))];
  const {data:profiles,error:pe}=await db.from("profiles")
   .select("id,username").in("id",ids);
  if(pe)throw pe;
  const names={};
  (profiles||[]).forEach(p=>names[p.id]=p.username);

  feed.innerHTML="";
  for(const post of posts){
   const card=document.createElement("div");
   card.className="post";
   const own=post.user_id===currentUser.id;
   let imageHTML="";

   if(post.image_url){
    const {data:signed,error:se}=await db.storage
     .from("post-images").createSignedUrl(post.image_url,3600);
    if(!se&&signed?.signedUrl)
     imageHTML='<img src="'+clean(signed.signedUrl)+'" alt="Post photo">';
    else imageHTML='<p class="small">Photo load nahi hui.</p>';
   }

   card.innerHTML=
    '<b>@'+clean(names[post.user_id]||"Member")+'</b>'+
    '<p>'+clean(post.caption)+'</p>'+
    imageHTML+
    '<p class="small">'+(post.created_at?new Date(post.created_at).toLocaleString():"")+'</p>'+
    (own?'<button class="delete">Delete Post</button>':'');

   if(own){
    card.querySelector(".delete").addEventListener("click",()=>{
     deletePost(post.id,post.image_url);
    });
   }
   feed.appendChild(card);
  }
 }catch(e){feed.textContent="Error: "+e.message;}
}

async function restoreSession(){
 const {data}=await db.auth.getSession();
 if(data.session){
  currentUser=data.session.user;
  showApp(currentUser.user_metadata?.username||"Member");
 }
}
restoreSession();
</script>
</body>
</html>
