
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fedbook</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080d18;--card:#111d31;--border:#263b59;--blue:#168cff;--text:#eef4fc;--muted:#91a8c5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial}
header{background:var(--card);padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0}
header h2{margin:0;color:var(--blue)}
main{max-width:650px;margin:15px auto;padding:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:15px;margin-bottom:14px}
input,textarea{width:100%;padding:12px;margin:7px 0;background:#0b1424;color:white;border:1px solid #33445f;border-radius:8px}
textarea{min-height:80px}
button{background:var(--blue);color:white;border:0;padding:11px 15px;border-radius:8px;margin:3px;cursor:pointer}
.secondary{background:#263b59}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.posthead{display:flex;align-items:center;gap:10px}
.postimg{width:100%;max-height:430px;object-fit:contain;margin-top:10px;border-radius:10px}
.posttext{white-space:pre-wrap;overflow-wrap:anywhere}
.verified{color:#168cff;font-weight:bold}
.result{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
nav button{flex:1}
</style>
</head>
<body>

<header>
<h2>FB Fedbook</h2>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</header>

<main>

<section id="auth" class="card">
<h2>Welcome to Fedbook</h2>
<input id="fullname" placeholder="Your Full Name" maxlength="50">
<input id="username" placeholder="Username" maxlength="20">
<input id="password" type="password" placeholder="Password">
<div class="actions">
<button onclick="signup()">Sign Up</button>
<button class="secondary" onclick="login()">Login</button>
</div>
<p class="muted">Username: 3-20 letters, numbers or underscore.<br>Password: minimum 8 characters.</p>
<p id="message"></p>
</section>

<section id="app" class="hidden">
<nav>
<button onclick="showSection('home')">Home</button>
<button onclick="showSection('profile')">Profile</button>
<button onclick="showSection('search')">Search</button>
<button onclick="showSection('official')">Official</button>
</nav>

<div id="homeSection">
<div class="card">
<h3>Create Post</h3>
<textarea id="caption" placeholder="What's on your mind?"></textarea>
<input id="photo" type="file" accept="image/*">
<button onclick="createPost()">Publish Post</button>
<p id="postmessage" class="muted"></p>
</div>
<h2>Feed</h2>
<div id="feed"></div>
</div>

<div id="profileSection" class="hidden">
<div class="card">
<div class="posthead">
<div class="avatar" id="myAvatar">F</div>
<div><h2 id="myName">My Profile</h2><p id="myUsername" class="muted"></p></div>
</div>
<p id="myBio"></p>
<p id="myCounts"></p>
<input id="editName" placeholder="Full Name">
<textarea id="editBio" placeholder="Bio"></textarea>
<input id="avatarFile" type="file" accept="image/*">
<button onclick="saveProfile()">Save Profile</button>
<h3>My Posts</h3>
<div id="myPosts"></div>
</div>
</div>

<div id="searchSection" class="hidden">
<div class="card">
<h3>Search People</h3>
<input id="searchText" placeholder="Search username">
<button onclick="searchPeople()">Search</button>
<div id="searchResults"></div>
</div>
</div>

<div id="officialSection" class="hidden">
<div class="card">
<h2>Fedbook Official</h2>
<div id="officialResult">Loading...</div>
</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL="https://eyvwfkavwppghmbjimgk.supabase.co";
const SUPABASE_KEY="sb_publishable_MC_4M9VxUmd5mZ1-r4Rs4g_eVZ8GxCG";
const FUNCTION_NAME="super-function";
const CLOUD_NAME="g1vmdztf";
const UPLOAD_PRESET="Fedbook_upload";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let myProfile=null;

const el=id=>document.getElementById(id);

function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function avatarHTML(p){
 const name=safe(p?.full_name||p?.username||"F");
 return p?.avatar_url
 ? `<div class="avatar"><img src="${safe(p.avatar_url)}"></div>`
 : `<div class="avatar">${name.charAt(0).toUpperCase()}</div>`;
}

function showMessage(t){el("message").textContent=t;}

function showSection(name){
 ["home","profile","search","official"].forEach(x=>{
  el(x+"Section").classList.toggle("hidden",x!==name);
 });
 if(name==="home")loadFeed();
 if(name==="profile")loadMyProfile();
 if(name==="official")loadOfficial();
}

function credentials(){
 const username=el("username").value.trim().toLowerCase();
 const password=el("password").value;
 if(!/^[a-z0-9_]{3,20}$/.test(username))
  throw Error("Username 3-20 letters, numbers ya underscore hona chahiye.");
 if(password.length<8)
  throw Error("Password kam se kam 8 characters ka hona chahiye.");
 return {username,password};
}

/* AUTH */
async function authRequest(action){
 const {username,password}=credentials();
 const {data,error}=await db.functions.invoke(FUNCTION_NAME,{
  body:{action,username,password,full_name:el("fullname").value.trim()}
 });
 if(error)throw Error("Function connection failed: "+error.message);
 if(data?.error)throw Error(data.error);
 return data;
}

async function signup(){
 try{
  if(!el("fullname").value.trim())throw Error("Apna naam bharo.");
  showMessage("Account ban raha hai...");
  await authRequest("signup");
  showMessage("Account banane ki request successful. Ab Login karo.");
 }catch(e){showMessage(e.message);}
}

async function login(){
 try{
  showMessage("Login ho raha hai...");
  const data=await authRequest("login");
  if(!data?.session?.access_token||!data?.session?.refresh_token)
   throw Error("Function ne login session nahi diya. Function code check karna hoga.");

  const {error}=await db.auth.setSession(data.session);
  if(error)throw error;

  const {data:sessionData}=await db.auth.getSession();
  currentUser=sessionData.session.user;
  await ensureProfile();
  await startApp();
 }catch(e){showMessage(e.message);}
}

async function ensureProfile(){
 const {data,error}=await db.from("profiles").select("*")
  .eq("id",currentUser.id).maybeSingle();
 if(error)throw error;
 if(data){myProfile=data;return;}

 const username=currentUser.user_metadata?.username||el("username").value.trim().toLowerCase();
 const full_name=currentUser.user_metadata?.full_name||el("fullname").value.trim()||username;

 const {data:newProfile,error:insertError}=await db.from("profiles")
  .insert({id:currentUser.id,username,full_name,bio:"",is_official:false})
  .select().single();

 if(insertError)throw insertError;
 myProfile=newProfile;
}

async function startApp(){
 el("auth").classList.add("hidden");
 el("app").classList.remove("hidden");
 el("logoutBtn").classList.remove("hidden");
 showSection("home");
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 myProfile=null;
 el("app").classList.add("hidden");
 el("logoutBtn").classList.add("hidden");
 el("auth").classList.remove("hidden");
 showMessage("Logout successful.");
}

/* FEED */
async function loadFeed(){
 const feed=el("feed");
 feed.textContent="Loading...";

 const {data:posts,error}=await db.from("posts")
  .select("*").order("created_at",{ascending:false}).limit(50);

 if(error){feed.textContent=error.message;return;}
 feed.innerHTML="";

 if(!posts?.length){feed.textContent="Abhi koi post nahi hai.";return;}

 for(const p of posts){
  const {data:user}=await db.from("profiles")
   .select("username,full_name,avatar_url,is_official")
   .eq("id",p.user_id).maybeSingle();

  const {count:likes}=await db.from("likes")
   .select("*",{count:"exact",head:true}).eq("post_id",p.id);

  const {data:myLike}=await db.from("likes")
   .select("user_id").eq("post_id",p.id)
   .eq("user_id",currentUser.id).maybeSingle();

  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
   <div class="posthead">${avatarHTML(user)}
    <div><b>${safe(user?.full_name||user?.username||"User")}</b>
    ${user?.is_official?'<span class="verified"> ✓</span>':''}
    <div class="muted">@${safe(user?.username||"user")}</div></div>
   </div>
   <p class="posttext">${safe(p.caption)}</p>
   ${p.image_url?`<img class="postimg" src="${safe(p.image_url)}">`:""}
   <div class="actions">
    <button class="secondary" data-like>${myLike?"Unlike":"Like"} (${likes||0})</button>
    <button class="secondary" data-comment>Comments</button>
   </div>
   <div id="comments-${p.id}"></div>`;

  card.querySelector("[data-like]").onclick=()=>toggleLike(p.id);
  card.querySelector("[data-comment]").onclick=()=>showComments(p.id);
  feed.appendChild(card);
 }
}

/* LIKES */
async function toggleLike(postId){
 const {data:existing,error}=await db.from("likes")
  .select("user_id").eq("post_id",postId)
  .eq("user_id",currentUser.id).maybeSingle();
 if(error)return alert(error.message);

 const result=existing
  ?await db.from("likes").delete().eq("post_id",postId).eq("user_id",currentUser.id)
  :await db.from("likes").insert({post_id:postId,user_id:currentUser.id});

 if(result.error)return alert(result.error.message);
 loadFeed();
}

/* COMMENTS */
async function showComments(postId){
 const box=el("comments-"+postId);
 if(!box)return;
 const {data,error}=await db.from("comments")
  .select("*").eq("post_id",postId).order("created_at");
 if(error){box.textContent=error.message;return;}

 let html=`<input id="comment-${postId}" placeholder="Write a comment">
 <button onclick="addComment(${postId})">Send</button>`;

 for(const c of data||[]){
  const {data:u}=await db.from("profiles")
   .select("username").eq("id",c.user_id).maybeSingle();
  html+=`<p><b>@${safe(u?.username||"user")}</b>: ${safe(c.content)}</p>`;
 }
 box.innerHTML=html;
}

async function addComment(postId){
 const content=el("comment-"+postId).value.trim();
 if(!content)return;
 const {error}=await db.from("comments").insert({
  post_id:postId,user_id:currentUser.id,content
 });
 if(error)return alert(error.message);
 showComments(postId);
}

/* CLOUDINARY */
async function uploadImage(file){
 if(!file)return null;
 if(!file.type.startsWith("image/"))throw Error("Image file select karo.");
 if(file.size>8*1024*1024)throw Error("Image 8 MB se chhoti honi chahiye.");

 const form=new FormData();
 form.append("file",file);
 form.append("upload_preset",UPLOAD_PRESET);

 const response=await fetch(
  `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
  {method:"POST",body:form}
 );
 const result=await response.json();
 if(!response.ok)throw Error(result.error?.message||"Upload failed.");
 return result.secure_url;
}

/* POSTS */
async function createPost(){
 try{
  const caption=el("caption").value.trim();
  const file=el("photo").files[0];
  if(!caption&&!file)throw Error("Text ya photo add karo.");

  el("postmessage").textContent="Uploading...";
  const image_url=file?await uploadImage(file):null;

  const {error}=await db.from("posts").insert({
   user_id:currentUser.id,caption,image_url
  });
  if(error)throw error;

  el("caption").value="";
  el("photo").value="";
  el("postmessage").textContent="Post publish ho gaya!";
  loadFeed();
 }catch(e){el("postmessage").textContent=e.message;}
}

/* PROFILE */
async function loadMyProfile(){
 const {data,error}=await db.from("profiles")
  .select("*").eq("id",currentUser.id).single();
 if(error){el("myPosts").textContent=error.message;return;}
 myProfile=data;

 el("myName").textContent=data.full_name||data.username;
 el("myUsername").textContent="@"+data.username;
 el("myBio").textContent=data.bio||"";
 el("editName").value=data.full_name||"";
 el("editBio").value=data.bio||"";
 el("myAvatar").innerHTML=data.avatar_url
  ?`<img src="${safe(data.avatar_url)}">`
  :safe((data.username||"F").charAt(0).toUpperCase());

 const {count:followers}=await db.from("follows")
  .select("*",{count:"exact",head:true}).eq("following_id",currentUser.id);
 const {count:following}=await db.from("follows")
  .select("*",{count:"exact",head:true}).eq("follower_id",currentUser.id);
 el("myCounts").textContent=`Followers: ${followers||0} | Following: ${following||0}`;

 const {data:posts}=await db.from("posts")
  .select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
 el("myPosts").innerHTML="";
 for(const p of posts||[]){
  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`<p>${safe(p.caption)}</p>${p.image_url?`<img class="postimg" src="${safe(p.image_url)}">`:""}`;
  el("myPosts").appendChild(div);
 }
}

async function saveProfile(){
 try{
  let avatar_url=myProfile?.avatar_url||null;
  const file=el("avatarFile").files[0];
  if(file)avatar_url=await uploadImage(file);

  const {error}=await db.from("profiles").update({
   full_name:el("editName").value.trim(),
   bio:el("editBio").value.trim(),
   avatar_url
  }).eq("id",currentUser.id);

  if(error)throw error;
  alert("Profile saved.");
  loadMyProfile();
 }catch(e){alert(e.message);}
}

/* SEARCH */
async function searchPeople(){
 const q=el("searchText").value.trim();
 if(!q){el("searchResults").textContent="Username likho.";return;}

 const {data,error}=await db.from("profiles")
  .select("id,username,full_name,avatar_url,is_official")
  .ilike("username","%"+q+"%").limit(20);

 if(error){el("searchResults").textContent=error.message;return;}
 el("searchResults").innerHTML="";

 for(const u of data||[]){
  const row=document.createElement("div");
  row.className="result";
  row.innerHTML=`${avatarHTML(u)}
   <div style="flex:1"><b>${safe(u.full_name||u.username)}</b>
   ${u.is_official?'<span class="verified">✓</span>':""}
   <div class="muted">@${safe(u.username)}</div></div>
   ${u.id===currentUser.id?"You":`<button data-follow>Follow</button>`}`;

  const btn=row.querySelector("[data-follow]");
  if(btn)btn.onclick=()=>toggleFollow(u.id,btn);
  el("searchResults").appendChild(row);
 }
}

/* FOLLOW */
async function toggleFollow(userId,button){
 const {data:existing,error}=await db.from("follows")
  .select("follower_id").eq("follower_id",currentUser.id)
  .eq("following_id",userId).maybeSingle();
 if(error)return alert(error.message);

 const result=existing
  ?await db.from("follows").delete().eq("follower_id",currentUser.id).eq("following_id",userId)
  :await db.from("follows").insert({follower_id:currentUser.id,following_id:userId});

 if(result.error)return alert(result.error.message);
 button.textContent=existing?"Follow":"Following";
}

/* OFFICIAL */
async function loadOfficial(){
 const box=el("officialResult");
 const {data,error}=await db.from("profiles")
  .select("username,full_name,bio,avatar_url,is_official")
  .eq("is_official",true).limit(1).maybeSingle();

 if(error){box.textContent=error.message;return;}
 if(!data){box.textContent="Official account abhi setup nahi hua.";return;}

 box.innerHTML=`<div class="posthead">${avatarHTML(data)}
 <div><b>${safe(data.full_name||data.username)}</b>
 <span class="verified">✓ Verified</span>
 <div class="muted">@${safe(data.username)}</div></div></div>
 <p>${safe(data.bio||"")}</p>`;
}

/* RESTORE SESSION */
async function init(){
 const {data,error}=await db.auth.getSession();
 if(error){showMessage(error.message);return;}
 if(data.session){
  currentUser=data.session.user;
  try{await ensureProfile();await startApp();}
  catch(e){showMessage(e.message);}
 }
}
init();
</script>
</body>
</html>
