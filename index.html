
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fedbook</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#eef4fc;font-family:Arial,sans-serif}
header{background:#111d31;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-size:25px;font-weight:bold;color:#168cff}
button{background:#168cff;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
nav{display:flex;justify-content:space-around;background:#111d31;padding:12px;position:sticky;top:55px}
nav button{background:transparent;color:#eef4fc}
main{max-width:650px;margin:auto;padding:14px}
.card{background:#111d31;border:1px solid #243653;border-radius:12px;padding:15px;margin:12px 0}
input,textarea{width:100%;padding:12px;background:#080d18;color:white;border:1px solid #243653;border-radius:8px;margin:7px 0}
.post img{width:100%;border-radius:10px;margin-top:10px}
.muted{color:#91a8c5;font-size:13px}
.stats{display:flex;justify-content:space-around;text-align:center;margin:20px 0}
.stats strong{display:block;font-size:21px;color:#168cff}
.avatar{width:75px;height:75px;border-radius:50%;background:#168cff;display:grid;place-items:center;font-size:30px;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>

<header>
 <div class="logo">FB Fedbook</div>
 <button onclick="showPage('profile')">My Profile</button>
</header>

<nav>
 <button onclick="showPage('home')">Home</button>
 <button onclick="showPage('friends')">Friends</button>
 <button onclick="showPage('search')">Search</button>
 <button onclick="showPage('profile')">Profile</button>
</nav>

<main>

<section id="home">
 <div class="card">
  <h3>Create Post</h3>
  <textarea id="postText" placeholder="What's on your mind?"></textarea>
  <input type="file" id="postPhoto" accept="image/*">
  <button onclick="addPost()">Post</button>
 </div>
 <div id="feed"></div>
</section>

<section id="profile" class="hidden">
 <div class="card">
  <div class="avatar">FB</div>
  <h2>Anurag</h2>
  <p class="muted">@guest · Demo Profile</p>
  <div class="stats">
   <div><strong id="postCount">0</strong>Posts</div>
   <div><strong>5M</strong>Followers</div>
   <div><strong>120</strong>Following</div>
  </div>
  <p>Welcome to my Fedbook profile!</p>
  <p class="muted">5M followers is a demo display, not real followers.</p>
 </div>
</section>

<section id="friends" class="hidden">
 <div class="card">
  <h2>Friends</h2>
  <p>Welcome to Fedbook Friends!</p>
  <p class="muted">Friend requests feature is a demo.</p>
 </div>
</section>

<section id="search" class="hidden">
 <div class="card">
  <h2>Search</h2>
  <input id="searchText" placeholder="Search posts..." oninput="searchPosts()">
  <div id="searchResults"></div>
 </div>
</section>

</main>

<script>
let posts=[];
try{
 posts=JSON.parse(localStorage.getItem("fedbook_posts")||"[]");
}catch(e){posts=[];}

function savePosts(){
 try{
  localStorage.setItem("fedbook_posts",JSON.stringify(posts));
 }catch(e){
  alert("Storage full. Please remove some photos.");
 }
}

function showPage(page){
 document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
 document.getElementById(page).classList.remove("hidden");
 if(page==="profile") updateCount();
}

function addPost(){
 const text=document.getElementById("postText").value.trim();
 const file=document.getElementById("postPhoto").files[0];
 if(!text&&!file){alert("Write something or select a photo");return;}
 const post={id:Date.now(),text,photo:"",likes:0,comments:[]};
 if(file){
  const reader=new FileReader();
  reader.onload=()=>{
   post.photo=reader.result;
   posts.unshift(post);
   savePosts();
   renderFeed();
   document.getElementById("postText").value="";
   document.getElementById("postPhoto").value="";
  };
  reader.readAsDataURL(file);
 }else{
  posts.unshift(post);
  savePosts();
  renderFeed();
  document.getElementById("postText").value="";
 }
}

function renderFeed(){
 const feed=document.getElementById("feed");
 feed.innerHTML="";
 posts.forEach(post=>{
  const card=document.createElement("div");
  card.className="card post";
  const heading=document.createElement("b");
  heading.textContent="Anurag · @guest";
  card.appendChild(heading);
  const p=document.createElement("p");
  p.textContent=post.text;
  card.appendChild(p);
  if(post.photo){
   const img=document.createElement("img");
   img.src=post.photo;
   card.appendChild(img);
  }
  const like=document.createElement("button");
  like.textContent="♥ Like ("+post.likes+")";
  like.onclick=()=>{post.likes++;savePosts();renderFeed();};
  card.appendChild(like);
  const commentInput=document.createElement("input");
  commentInput.placeholder="Write a comment...";
  card.appendChild(commentInput);
  const commentButton=document.createElement("button");
  commentButton.textContent="Comment";
  commentButton.onclick=()=>{
   if(commentInput.value.trim()){
    post.comments.push(commentInput.value.trim());
    savePosts();
    renderFeed();
   }
  };
  card.appendChild(commentButton);
  post.comments.forEach(comment=>{
   const c=document.createElement("p");
   c.className="muted";
   c.textContent="💬 "+comment;
   card.appendChild(c);
  });
  feed.appendChild(card);
 });
 updateCount();
}

function updateCount(){
 document.getElementById("postCount").textContent=posts.length;
}

function searchPosts(){
 const q=document.getElementById("searchText").value.toLowerCase();
 const results=document.getElementById("searchResults");
 results.innerHTML="";
 posts.filter(p=>p.text.toLowerCase().includes(q)).forEach(p=>{
  const item=document.createElement("div");
  item.className="card";
  item.textContent=p.text;
  results.appendChild(item);
 });
}

renderFeed();
</script>
</body>
</html>
