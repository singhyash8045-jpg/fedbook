
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}
header{height:60px;background:#111827;border-bottom:1px solid #263247;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0}
.logo{font-size:23px;font-weight:bold;color:#3998ff}
main{max-width:600px;margin:auto;padding:15px}
.card{background:#111827;border:1px solid #29364a;border-radius:14px;padding:18px;margin:15px 0}
input,textarea,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #34445c;background:#080b12;color:white}
button{background:#1877f2;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#29364a}
.hidden{display:none!important}
.muted{color:#9aa9bd;font-size:13px}
.post{background:#111827;border:1px solid #29364a;border-radius:13px;margin:15px 0;overflow:hidden}
.post img{width:100%;max-height:500px;object-fit:contain;background:#000}
.post-content{padding:14px}
.actions{display:flex;gap:8px}
.actions button{flex:1}
h2{margin-top:0}
</style>
</head>
<body>
<header>
<div class="logo">UC Universal Chat</div>
<button id="logout" class="secondary hidden" style="width:auto">Logout</button>
</header>

<main>
<section id="auth">
<div class="card">
<h2>Welcome to Universal Chat</h2>
<p class="muted">Connect with everyone.</p>
<h3>Create Account</h3>
<input id="newUsername" placeholder="Username">
<input id="newPassword" type="password" placeholder="Password (6+ characters)">
<button id="signup">Create Account</button>
<hr>
<h3>Login</h3>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button id="login">Login</button>
<p id="authMessage" class="muted"></p>
</div>
</section>

<section id="app" class="hidden">
<div class="card">
<h2 id="welcome">Home</h2>
<p class="muted">Welcome to your Universal Chat community.</p>
</div>

<div class="card">
<h2>Create Post</h2>
<textarea id="caption" placeholder="What's happening?"></textarea>
<input id="photo" type="file" accept="image/*">
<button id="publish">Publish Post</button>
<p id="postMessage" class="muted"></p>
</div>

<div class="card">
<h2>Home Feed</h2>
<button id="refresh" class="secondary">Refresh Posts</button>
<div id="feed"></div>
</div>

<div class="card">
<h2>My Profile</h2>
<p id="profile"></p>
<p class="muted">Universal Chat Member</p>
</div>
</section>
</main>

<script>
const SUPABASE_URL="https://pncaubpjfthccofynxya.supabase.co";
const SUPABASE_KEY="sb_publishable_X_Mv4fdvzlN437ZStGuxdA_0lBnvzX6";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let currentUsername="";

const $=id=>document.getElementById(id);
function message(id,text){$(id).textContent=text;}

function showApp(user,username){
currentUser=user;
currentUsername=username;
$("auth").classList.add("hidden");
$("app").classList.remove("hidden");
$("logout").classList.remove("hidden");
$("welcome").textContent="Welcome, "+username;
$("profile").textContent="@"+username;
loadPosts();
}

async function saveProfile(user,username){
const {error}=await db.from("profiles").upsert({
id:user.id,
username:username
},{onConflict:"id"});
if(error)throw error;
}

$("signup").onclick=async()=>{
const username=$("newUsername").value.trim().toLowerCase();
const password=$("newPassword").value;

if(!/^[a-z0-9_]{3,20}$/.test(username)){
message("authMessage","Username 3-20 characters ka hona chahiye.");
return;
}
if(password.length<6){
message("authMessage","Password kam se kam 6 characters ka rakho.");
return;
}

message("authMessage","Account creating...");
$("signup").disabled=true;

try{
const {data,error}=await db.auth.signUp({
email:username+"@universalchat.app",
password:password,
options:{data:{username:username}}
});
if(error)throw error;
if(!data.user)throw new Error("Account create nahi hua.");

if(data.session){
await saveProfile(data.user,username);
showApp(data.user,username);
}else{
message("authMessage","Account ban gaya. Email confirmation ke baad login karo.");
}
}catch(e){
message("authMessage",e.message);
}finally{
$("signup").disabled=false;
}
};

$("login").onclick=async()=>{
const username=$("username").value.trim().toLowerCase();
const password=$("password").value;

if(!username||!password){
message("authMessage","Username aur password likho.");
return;
}

message("authMessage","Logging in...");
$("login").disabled=true;

try{
const {data,error}=await db.auth.signInWithPassword({
email:username+"@universalchat.app",
password:password
});
if(error)throw error;

await saveProfile(data.user,username);
showApp(data.user,username);
}catch(e){
message("authMessage","Login Error: "+e.message);
}finally{
$("login").disabled=false;
}
};

$("logout").onclick=async()=>{
await db.auth.signOut();
location.reload();
};

$("publish").onclick=async()=>{
const caption=$("caption").value.trim();
const file=$("photo").files[0];

if(!caption&&!file){
message("postMessage","Caption ya photo add karo.");
return;
}
if(file){
message("postMessage","Photo upload ke liye Cloudinary setup abhi baaki hai.");
return;
}

try{
const {error}=await db.from("posts").insert({
user_id:currentUser.id,
caption:caption,
image_url:null
});
if(error)throw error;
$("caption").value="";
message("postMessage","Post published!");
loadPosts();
}catch(e){
message("postMessage",e.message);
}
};

async function loadPosts(){
if(!currentUser)return;
const feed=$("feed");
feed.textContent="Loading posts...";

const {data:posts,error}=await db.from("posts")
.select("*").order("created_at",{ascending:false});

if(error){
feed.textContent=error.message;
return;
}
feed.innerHTML="";

if(!posts.length){
feed.textContent="No posts yet. Be the first to post!";
return;
}

const ids=[...new Set(posts.map(p=>p.user_id))];
const {data:profiles}=await db.from("profiles")
.select("id,username").in("id",ids);

const names={};
(profiles||[]).forEach(p=>names[p.id]=p.username);

posts.forEach(post=>{
const article=document.createElement("div");
article.className="post";

const content=document.createElement("div");
content.className="post-content";

const user=document.createElement("b");
user.textContent="@"+(names[post.user_id]||"Member");

const caption=document.createElement("p");
caption.textContent=post.caption||"";

const date=document.createElement("small");
date.className="muted";
date.textContent=new Date(post.created_at).toLocaleString();

content.append(user,caption,date);

if(post.image_url){
const img=document.createElement("img");
img.src=post.image_url;
article.appendChild(img);
}
article.appendChild(content);
feed.appendChild(article);
});
}

$("refresh").onclick=loadPosts;

async function restoreSession(){
const {data,error}=await db.auth.getSession();
if(error){
message("authMessage",error.message);
return;
}
if(data.session){
const user=data.session.user;
const {data:profile}=await db.from("profiles")
.select("username").eq("id",user.id).maybeSingle();
const username=profile?.username||user.user_metadata?.username||"Member";
showApp(user,username);
}
}
restoreSession();
</script>
</body>
</html>
