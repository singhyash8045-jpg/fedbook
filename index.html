
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fedbook</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#eef4fc;font-family:Arial}
header,nav{background:#111d31;padding:15px;display:flex;justify-content:space-around;align-items:center;position:sticky;top:0}
.logo{color:#168cff;font-size:25px;font-weight:bold}
button{background:#168cff;color:white;border:0;padding:10px 14px;border-radius:8px;margin:4px;cursor:pointer}
input{background:#080d18;color:white;border:1px solid #243653;padding:12px;border-radius:8px;width:100%;margin:8px 0}
main{max-width:650px;margin:auto;padding:12px}
.card{background:#111d31;border:1px solid #243653;border-radius:12px;padding:16px;margin:12px 0}
.avatar{width:65px;height:65px;border-radius:50%;background:#168cff;display:grid;place-items:center;font-size:25px;font-weight:bold}
.stats{display:flex;justify-content:space-around;text-align:center;margin:20px 0}
.stats button{background:transparent;color:#eef4fc}
.stats strong{display:block;color:#168cff;font-size:20px}
.user{display:flex;align-items:center;gap:12px}
.hidden{display:none}
.muted{color:#91a8c5;font-size:13px}
</style>
</head>
<body>

<header>
 <div class="logo">FB Fedbook</div>
 <button onclick="openProfile(currentUser)">My Profile</button>
</header>

<nav>
 <button onclick="page('home')">Home</button>
 <button onclick="page('people')">People</button>
 <button onclick="page('search')">Search</button>
</nav>

<main>
<section id="home">
 <div class="card">
  <h2>Welcome to Fedbook</h2>
  <p>Find people and follow your friends!</p>
 </div>
 <div id="homeUsers"></div>
</section>

<section id="people" class="hidden">
 <div class="card">
  <h2>People</h2>
  <div id="peopleList"></div>
 </div>
</section>

<section id="search" class="hidden">
 <div class="card">
  <h2>Search People</h2>
  <input id="searchBox" placeholder="Search name..." oninput="searchPeople()">
  <div id="searchResults"></div>
 </div>
</section>

<section id="profile" class="hidden">
 <div class="card">
  <div class="avatar" id="avatar">FB</div>
  <h2 id="profileName"></h2>
  <p class="muted" id="profileUsername"></p>
  <div class="stats">
   <button onclick="showList('followers')">
    <strong id="followerCount">0</strong>Followers
   </button>
   <button onclick="showList('following')">
    <strong id="followingCount">0</strong>Following
   </button>
  </div>
  <button id="followButton" onclick="toggleFollow()">Follow</button>
  <button onclick="page('people')">Back</button>
  <p class="muted">Demo profile</p>
 </div>
 <div id="listArea"></div>
</section>
</main>

<script>
const currentUser="anurag";

const users=[
 {id:"anurag",name:"Anurag",username:"@anurag"},
 {id:"rohit",name:"Rohit Sharma",username:"@rohit"},
 {id:"virat",name:"Virat Kohli",username:"@virat"},
 {id:"dhoni",name:"MS Dhoni",username:"@dhoni"},
 {id:"hardik",name:"Hardik Pandya",username:"@hardik"},
 {id:"rahul",name:"KL Rahul",username:"@rahul"}
];

let relationships={};
let currentProfile=currentUser;

try{
 relationships=JSON.parse(localStorage.getItem("fb_relationships")||"{}");
}catch(e){relationships={};}

function save(){
 localStorage.setItem("fb_relationships",JSON.stringify(relationships));
}

function setup(id){
 if(!relationships[id]){
  relationships[id]={followers:[],following:[]};
 }
 return relationships[id];
}

users.forEach(u=>setup(u.id));

function page(id){
 document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 if(id==="people")renderPeople();
 if(id==="home")renderHome();
}

function renderHome(){
 document.getElementById("homeUsers").innerHTML=
 users.filter(u=>u.id!==currentUser).map(u=>
 `<div class="card user">
 <div class="avatar">FB</div>
 <div><b>${u.name}</b><p class="muted">${u.username}</p>
 <button onclick="openProfile('${u.id}')">View Profile</button></div>
 </div>`).join("");
}

function renderPeople(){
 document.getElementById("peopleList").innerHTML=
 users.filter(u=>u.id!==currentUser).map(u=>
 `<div class="card user">
 <div class="avatar">FB</div>
 <div><b>${u.name}</b><p class="muted">${u.username}</p>
 <button onclick="openProfile('${u.id}')">View Profile</button></div>
 </div>`).join("");
}

function openProfile(id){
 const u=users.find(x=>x.id===id);
 if(!u)return;
 currentProfile=id;
 page("profile");
 document.getElementById("profileName").textContent=u.name;
 document.getElementById("profileUsername").textContent=u.username;
 document.getElementById("avatar").textContent=u.name[0].toUpperCase();

 let data=setup(id);
 document.getElementById("followerCount").textContent=
 id==="anurag"?"5M":data.followers.length;
 document.getElementById("followingCount").textContent=data.following.length;

 const btn=document.getElementById("followButton");
 if(id===currentUser){
  btn.style.display="none";
 }else{
  btn.style.display="inline-block";
  btn.textContent=setup(id).followers.includes(currentUser)?"Following":"Follow";
 }
 document.getElementById("listArea").innerHTML="";
}

function toggleFollow(){
 if(currentProfile===currentUser)return;
 let me=setup(currentUser);
 let other=setup(currentProfile);
 if(me.following.includes(currentProfile)){
  me.following=me.following.filter(x=>x!==currentProfile);
  other.followers=other.followers.filter(x=>x!==currentUser);
 }else{
  me.following.push(currentProfile);
  if(!other.followers.includes(currentUser)){
   other.followers.push(currentUser);
  }
 }
 save();
 openProfile(currentProfile);
}

function showList(type){
 let data=setup(currentProfile);
 let ids=data[type];
 let area=document.getElementById("listArea");
 area.innerHTML="<div class='card'><h3>"+(type==="followers"?"Followers":"Following")+"</h3></div>";
 let card=area.firstChild;
 if(ids.length===0){
  card.innerHTML+="<p class='muted'>No users yet.</p>";
 }
 ids.forEach(id=>{
  let u=users.find(x=>x.id===id);
  if(!u)return;
  let b=document.createElement("button");
  b.textContent=u.name+" · "+u.username;
  b.onclick=()=>openProfile(u.id);
  card.appendChild(b);
 });
}

function searchPeople(){
 let q=document.getElementById("searchBox").value.toLowerCase();
 let found=users.filter(u=>
 u.name.toLowerCase().includes(q)||
 u.username.toLowerCase().includes(q)
 );
 document.getElementById("searchResults").innerHTML=found.map(u=>
 `<div class="card">
 <b>${u.name}</b><p class="muted">${u.username}</p>
 <button onclick="openProfile('${u.id}')">View Profile</button>
 </div>`).join("");
}

renderHome();
</script>
</body>
</html>
